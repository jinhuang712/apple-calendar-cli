<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">acal</title>
  <desc id="d">acal: your Mac's Calendar from the command line. A calendar icon beside a terminal that lists events, previews a delete, then deletes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#glow)"/>

  <!-- calendar icon -->
  <g transform="translate(72 54) scale(0.9)" filter="url(#shadow)">
    <rect width="150" height="160" rx="24" fill="#ffffff"/>
    <path d="M0 24a24 24 0 0 1 24-24h102a24 24 0 0 1 24 24v36H0z" fill="url(#head)"/>
    <rect x="34" y="-10" width="12" height="28" rx="6" fill="#ffe4e6"/>
    <rect x="104" y="-10" width="12" height="28" rx="6" fill="#ffe4e6"/>
    <g fill="#c4b5fd">
      <circle cx="38" cy="90" r="7"/><circle cx="75" cy="90" r="7"/><circle cx="112" cy="90" r="7"/>
      <circle cx="38" cy="122" r="7"/><circle cx="112" cy="122" r="7"/>
    </g>
    <circle cx="75" cy="122" r="9" fill="#e11d48"/>
  </g>

  <!-- title -->
  <text x="70" y="300" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">acal</text>
  <text x="72" y="338" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#fbcfe8">Your Mac's Calendar, from the command line.</text>
  <text x="72" y="370" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#c4b5fd">JSON in · JSON out · safe by default</text>

  <!-- terminal -->
  <g transform="translate(560 56)" filter="url(#shadow)">
    <rect width="570" height="288" rx="16" fill="#0f172a"/>
    <path d="M0 16A16 16 0 0 1 16 0h538a16 16 0 0 1 16 16v26H0z" fill="#1e293b"/>
    <circle cx="26" cy="21" r="7" fill="#ff5f57"/>
    <circle cx="50" cy="21" r="7" fill="#febc2e"/>
    <circle cx="74" cy="21" r="7" fill="#28c840"/>
    <g font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
      <text x="24" y="84"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> acal events --from 2026-11-03</tspan></text>
      <text x="24" y="110"><tspan fill="#fb923c">{"title"</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#38bdf8">"Team sync"</tspan><tspan fill="#94a3b8">,</tspan><tspan fill="#fb923c">"start"</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#38bdf8">"2026-11-03T10:00Z"</tspan><tspan fill="#fb923c">}</tspan></text>

      <text x="24" y="160"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> acal rm &lt;id&gt; --span future</tspan></text>
      <text x="24" y="186"><tspan fill="#fb923c">{"preview"</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#facc15">true</tspan><tspan fill="#fb923c">}</tspan><tspan fill="#64748b">   # nothing was deleted</tspan></text>

      <text x="24" y="236"><tspan fill="#4ade80">$</tspan><tspan fill="#e2e8f0"> acal rm &lt;id&gt; --span future </tspan><tspan fill="#f472b6">--yes</tspan></text>
      <text x="24" y="262"><tspan fill="#fb923c">{"removed"</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#4ade80">true</tspan><tspan fill="#fb923c">}</tspan></text>
    </g>
  </g>
</svg>
